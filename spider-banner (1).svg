<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Gugan Krishna" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b5e"/>
      <stop offset="1" stop-color="#050a1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e01e2b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e01e2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="260" fill="url(#bg)"/>
  <ellipse cx="450" cy="140" rx="330" ry="110" fill="url(#glow)">
    <animate attributeName="opacity" values=".4;1;.4" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- corner web, drawn in on load -->
  <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2.4s" fill="freeze"/>
    <path d="M0 0 L260 0 M0 0 L240 90 M0 0 L170 170 M0 0 L90 240 M0 0 L0 260"/>
    <path d="M60 0 Q40 40 0 60 M120 0 Q90 90 0 120 M180 0 Q140 140 0 180 M240 0 Q190 190 0 240"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="500" stroke-dashoffset="500" transform="translate(900 260) rotate(180)">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="2.4s" begin=".4s" fill="freeze"/>
    <path d="M0 0 L220 0 M0 0 L200 80 M0 0 L140 140 M0 0 L80 200 M0 0 L0 220"/>
    <path d="M60 0 Q40 40 0 60 M120 0 Q90 90 0 120 M180 0 Q140 140 0 180"/>
  </g>

  <!-- title with offset red and blue shadow -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-size="78" text-anchor="middle" letter-spacing="3">
    <text x="458" y="138" fill="#1c4bd8">GUGAN KRISHNA</text>
    <text x="454" y="134" fill="#e01e2b">GUGAN KRISHNA</text>
    <text x="450" y="130" fill="#fff">GUGAN KRISHNA</text>
  </g>
  <text x="450" y="178" font-family="Arial, sans-serif" font-size="20" letter-spacing="6" text-anchor="middle" fill="#b9c4ee">DESIGN &#215; MARKETING &#215; AI</text>
  <rect x="380" y="198" width="140" height="5" fill="#e01e2b">
    <animate attributeName="width" values="20;140;20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="440;380;440" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- spider lowering and rising on a thread -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="780 40;780 130;780 40" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
    <line x1="0" y1="-260" x2="0" y2="0" stroke="#fff" stroke-width="1.5"/>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M-4 0 L-18 -8 L-24 4 M-4 3 L-20 8 L-22 20 M4 0 L18 -8 L24 4 M4 3 L20 8 L22 20"/>
      <path d="M-3 -4 L-12 -16 L-20 -12 M3 -4 L12 -16 L20 -12"/>
    </g>
    <circle cx="0" cy="3" r="9" fill="#e01e2b"/>
    <circle cx="0" cy="-6" r="6" fill="#1c4bd8"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
